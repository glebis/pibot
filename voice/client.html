<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice</title>
<style>
:root{
  --bg:#f3f0e8;--card:#fffdf8;--ink:#20241e;--muted:#5d6459;--line:#e2ded2;--field:#ffffff;
  --accent:#2f5d3a;--accent-ink:#ffffff;--accent-soft:#e3ecdf;--end:#b3412e;--end-soft:#f6e1dc;
  --chip:#f1eee6;--chip-on:#2f5d3a;--chip-on-ink:#ffffff;--focus:#b58336;
  --shadow:0 18px 50px #20241e10;--ring:0 0 0 14px #2f5d3a1f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151815;--card:#1d211d;--ink:#eef0ea;--muted:#a9b0a3;--line:#323830;--field:#232823;
  --accent:#7fbf8c;--accent-ink:#10160f;--accent-soft:#25322a;--end:#f08a73;--end-soft:#3a2622;
  --chip:#272c26;--chip-on:#7fbf8c;--chip-on-ink:#10160f;--focus:#e0b061;
  --shadow:0 18px 50px #00000059;--ring:0 0 0 14px #7fbf8c26;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151815;--card:#1d211d;--ink:#eef0ea;--muted:#a9b0a3;--line:#323830;--field:#232823;
  --accent:#7fbf8c;--accent-ink:#10160f;--accent-soft:#25322a;--end:#f08a73;--end-soft:#3a2622;
  --chip:#272c26;--chip-on:#7fbf8c;--chip-on-ink:#10160f;--focus:#e0b061;
  --shadow:0 18px 50px #00000059;--ring:0 0 0 14px #7fbf8c26;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:clamp(16px,4vw,48px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(16px,2.5vw,32px);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(20px,3vw,36px)}
.talk{position:sticky;top:24px;display:flex;flex-direction:column;gap:22px}
.side{display:flex;flex-direction:column;gap:clamp(16px,2.5vw,32px)}
h2{font-size:1.45rem;letter-spacing:-.02em;margin:0}
.row{display:flex;gap:12px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:18px;padding:0 18px;min-height:64px;width:100%;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 26px) 50%,calc(100% - 20px) 50%;background-size:6px 6px;background-repeat:no-repeat}
#agent{font-size:1.6rem;font-weight:650;letter-spacing:-.02em;min-height:76px}
#mic{min-height:52px;font-size:.95rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.icon{width:64px;height:64px;flex:none;border-radius:18px;border:1px solid var(--line);background:var(--field);font-size:1.5rem}
.stage{display:grid;place-items:center;padding:18px 0 6px}
.big{width:min(240px,62vw);aspect-ratio:1;border-radius:50%;font-size:2rem;font-weight:700;letter-spacing:-.02em;transition:transform .15s ease,box-shadow .3s ease}
.big:not(:disabled):hover{transform:scale(1.03)}
#start{background:var(--accent);color:var(--accent-ink);box-shadow:var(--ring)}
#stop{background:var(--end);color:#fff;box-shadow:0 0 0 14px var(--end-soft);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 24px var(--end-soft)}}
@media (prefers-reduced-motion:reduce){#stop{animation:none}.big{transition:none}}
#status{font-size:1.15rem;font-weight:600;text-align:center;min-height:1.6em;margin:0}
#levels{display:grid;gap:10px}
.level{display:grid;grid-template-columns:4.5em 1fr;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
meter{width:100%;height:14px;border-radius:7px}
meter::-webkit-meter-bar{background:var(--chip);border:0;border-radius:7px;height:14px}
meter::-webkit-meter-optimum-value{background:var(--accent);border-radius:7px}
meter::-moz-meter-bar{background:var(--accent);border-radius:7px}
#device{font-size:.9rem;color:var(--muted);text-align:center}
#play{min-height:56px;border-radius:18px;background:var(--accent-soft);font-weight:650}
.tools-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
#tool-count{color:var(--muted);font-size:.95rem;margin-left:8px;font-weight:500}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px}
.seg button{min-height:48px;padding:0 20px;border-radius:12px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 8px #0000001a}
#tools{display:grid;gap:12px}
.group{border:1px solid var(--line);border-radius:20px;padding:8px 12px}
.group-head{display:flex;align-items:center;gap:6px;min-height:60px}
.toggle{display:grid;place-items:center;width:72px;height:56px;flex:none;border-radius:16px}
.expand{flex:1;display:flex;align-items:center;gap:12px;min-height:56px;text-align:left;font-size:1.1rem;font-weight:650;border-radius:14px;padding:0 8px}
.expand::after{content:"›";font-size:1.6rem;color:var(--muted);transition:transform .2s;line-height:1}
.expand[aria-expanded="true"]::after{transform:rotate(90deg)}
.switch{flex:none;width:58px;height:34px;border-radius:17px;background:var(--chip);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px #0003;transition:left .2s}
[aria-checked="true"] > .switch{background:var(--accent)}
[aria-checked="true"] > .switch::after{left:28px}
[aria-checked="mixed"] > .switch{background:var(--accent);opacity:.55}
[aria-checked="mixed"] > .switch::after{left:16px}
.expand small{margin-left:auto;color:var(--muted);font-weight:500;font-size:.95rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 8px 12px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px dashed var(--line);color:var(--muted);font-size:.95rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chip[aria-pressed="true"]{border:1.5px solid transparent;background:var(--accent-soft);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.empty{color:var(--muted);margin:0}
.transcript{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.turn{padding:14px 18px;border-radius:20px;background:var(--chip);white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.turn.you{align-self:flex-end;background:var(--accent-soft)}
.turn strong{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
#transcript:empty::before{content:"Your conversation appears here.";color:var(--muted)}
#agent-detail{margin:-10px 0 0;color:var(--end);font-size:.95rem}
#agent-detail:empty{display:none}
#scope-note{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.85rem;margin:0}
.tools-title{display:flex;align-items:center;gap:10px;min-height:48px;font:inherit;font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.tools-title::after{content:"›";font-size:1.7rem;color:var(--muted);transition:transform .2s;line-height:1}
.tools-title[aria-expanded="true"]::after{transform:rotate(90deg)}
.tools-head.closed{margin-bottom:0}
.live-only{display:none}
#modes{display:flex}
#mode-note{margin:10px 4px 0;color:var(--muted);font-size:.95rem;min-height:2.9em}
.badge{padding:3px 12px;border-radius:12px;font-size:.85rem !important;font-weight:650 !important;background:var(--accent-soft)}
.badge.agent{background:var(--end-soft);color:var(--end)}
#call-time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600 !important}
#modes button{flex:1}
.task{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-top:1px solid var(--line);width:100%;text-align:left;border-radius:12px}
.task:hover{background:var(--chip)}
.task-detail{grid-column:1/-1;margin-top:8px;display:grid;gap:8px;font-size:.92rem}
.task-detail div{white-space:pre-wrap;overflow-wrap:anywhere}
.task-detail span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.task-detail .result{max-height:40vh;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.task:first-child{border-top:0}
.task b{font-weight:650;overflow-wrap:anywhere}
.task .pill{align-self:start;padding:2px 12px;border-radius:12px;font-size:.85rem;font-weight:650;background:var(--chip)}
.task .pill.running,.task .pill.queued{background:var(--accent-soft);color:var(--ink)}
.task .pill.done{background:var(--accent);color:var(--accent-ink)}
.task .pill.failed{background:var(--end-soft);color:var(--end)}
.task small{grid-column:1/-1;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.turn.event{align-self:center;background:transparent;border:1px dashed var(--line);font-size:.95rem;color:var(--muted)}
.live #mode-box{display:none}
/* During a call the talk card shrinks to one slim bar pinned on top; the conversation gets the room. */
main.live{grid-template-columns:1fr}
.live .talk{position:sticky;top:10px;z-index:5;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px 10px 20px;border-radius:24px}
.live .talk > .row,.live #agent-detail{display:none}
.live #mic{width:auto;max-width:240px;min-height:44px;font-size:.85rem;padding-right:40px}
.live .live-only{display:block;font-weight:700;font-size:1.05rem}
.live #status{flex:1;min-width:8em;text-align:left;font-size:1rem;font-weight:500;color:var(--muted)}
.live #levels{display:flex;gap:14px;align-items:center}
.live .level{grid-template-columns:auto 72px;gap:8px;font-size:.8rem}
.live #device{max-width:22ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.live .stage{padding:0;order:9}
.live .big{width:auto;aspect-ratio:auto;min-height:52px;padding:0 26px;border-radius:26px;font-size:1.05rem;animation:none;box-shadow:none}
.live #play{min-height:44px;padding:0 16px}
.live #stop{animation:none;box-shadow:0 0 0 4px var(--end-soft)}
.live .stage{display:flex;gap:10px;align-items:center}
#mute{min-height:52px;padding:0 24px;border-radius:26px;border:1.5px solid var(--line);background:var(--field);font-weight:700;font-size:1.05rem}
#mute[aria-pressed="true"]{background:var(--end-soft);color:var(--end);border-color:transparent}
.muted #mic-level{opacity:.35}
.live .level meter{width:72px}
.live .transcript{max-height:62vh}
[hidden]{display:none!important}
@media (max-width:860px){main{grid-template-columns:1fr}.talk{position:static}.live .talk{position:sticky}.live #levels .level span{display:none}.live .level{grid-template-columns:56px}.live .level meter{width:56px}}
</style>
</head>
<body>
<main>
<section class="card talk" aria-label="Talk">
  <span id="live-agent" class="live-only"></span>
  <span id="live-mode" class="live-only badge"></span>
  <span id="call-time" class="live-only" aria-label="Call time">0:00</span>
  <div class="row">
    <select id="agent" aria-label="Agent" disabled><option>Loading…</option></select>
    <button id="refresh" class="icon" aria-label="Refresh agents" title="Refresh agents" disabled>↻</button>
  </div>
  <p id="agent-detail"></p>
  <div id="mode-box">
    <div class="seg" id="modes" role="group" aria-label="Voice mode">
      <button id="mode-front" aria-pressed="true">Fast</button>
      <button id="mode-realtime" aria-pressed="false" hidden>Realtime</button>
      <button id="mode-agent" aria-pressed="false">Agent</button>
    </div>
    <p id="mode-note"></p>
  </div>
  <div class="stage">
    <button id="start" class="big" disabled>Talk</button>
    <button id="mute" aria-pressed="false" aria-keyshortcuts="M" title="Mute (M)" hidden>Mute</button>
    <button id="stop" class="big" disabled hidden>End</button>
  </div>
  <p id="status" role="status" aria-live="polite">Checking…</p>
  <button id="play" hidden>Play agent audio</button>
  <div id="levels" hidden>
    <div class="level"><span>You</span><meter id="mic-level" min="0" max="1" value="0"></meter></div>
    <div class="level"><span>Agent</span><meter id="agent-level" min="0" max="1" value="0"></meter></div>
    <div id="device"></div>
  </div>
  <select id="mic" aria-label="Microphone"><option value="">System microphone</option></select>
  <audio id="audio" autoplay></audio>
</section>
<div class="side">
  <section class="card" aria-label="Conversation">
    <div id="transcript" class="transcript" role="log" aria-label="Conversation" aria-live="polite"></div>
  </section>
  <section class="card" id="tasks-card" aria-labelledby="tasks-title" hidden>
    <h2 id="tasks-title">Tasks</h2>
    <div id="tasks"></div>
  </section>
  <section class="card" aria-labelledby="tools-toggle">
    <div class="tools-head" id="tools-head">
      <button id="tools-toggle" class="tools-title" aria-expanded="true" aria-controls="tools-body">Tools<span id="tool-count"></span></button>
      <div class="seg" id="tools-presets" role="group" aria-label="Tool presets">
        <button id="tools-none" aria-pressed="false">None</button>
        <button id="tools-all" aria-pressed="false">All</button>
      </div>
    </div>
    <div id="tools-body"><div id="tools"><p class="empty">Pick an agent to see its tools.</p></div></div>
  </section>
</div>
<p id="scope-note"></p>
</main>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.hash.slice(1));
  const requestedAgent = params.get('agent');
  let secret = params.get('token') || '';
  // Remember the key in this browser, so the bare address works after opening a /voice link once.
  const KEY = 'pibot-voice-token';
  const remembered = () => { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
  const forget = () => { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch {} };
  if (secret) { try { localStorage.setItem(KEY, secret); } catch { try { sessionStorage.setItem(KEY, secret); } catch {} } }
  else secret = remembered();
  history.replaceState(null, '', location.pathname + location.search);
  // Opening a fresh launch link in an already-open tab only changes the fragment; reload to pick it up.
  window.addEventListener('hashchange', () => { if (new URLSearchParams(location.hash.slice(1)).has('token')) location.reload(); });
  const validToken = /^[a-f0-9]{64}$/i.test(secret);
  const micSelect = $('mic'), agentSelect = $('agent'), startButton = $('start'), stopButton = $('stop'), refreshButton = $('refresh'), audio = $('audio');
  let agents = [], audioReady = false, pc = null, stream = null, active = false, stopping = false, generation = 0, timer = null, controller = null, meterContext = null, silenceTimer = null;
  // Tools for the selected agent: groups from the bot, the owner's choice remembered per agent.
  let toolGroups = [], chosen = new Set(); const expanded = new Set();
  let muted = false;
  const MODES = {
    front: ['Fast', 'Answers in a few seconds. Longer work runs as background tasks you can follow below.'],
    realtime: ['Realtime', 'OpenAI speech-to-speech: natural voice, interrupt any time. Same background tasks. Experimental.'],
    agent: ['Agent', 'The full agent with all its tools on every turn. Slow, and the chat waits while it works.'],
  };
  let mode = 'front', realtimeReady = false; try { mode = localStorage.getItem('pibot-voice-mode') || 'front'; } catch {}
  function showMode() {
    if (!MODES[mode] || (mode === 'realtime' && !realtimeReady)) mode = 'front';
    for (const id of Object.keys(MODES)) { const b = $('mode-' + id); b.setAttribute?.('aria-pressed', String(mode === id)); b.disabled = active || stopping; }
    $('mode-realtime').hidden = !realtimeReady;
    $('mode-note').textContent = MODES[mode][1];
  }
  // call clock in the call bar
  let callStarted = 0, clock = null;
  function tickClock() { const s = Math.floor((Date.now() - callStarted) / 1000); $('call-time').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  // ── background tasks (durable ledger) ──
  let tasksTimer = null; const openTasks = new Set();
  const ago = ms => { const m = Math.round(ms / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
  async function loadTasks() {
    clearTimeout(tasksTimer); tasksTimer = setTimeout(() => void loadTasks(), 5000);
    const agentId = agentSelect.value; if (!agentId || !selected()?.available || !document.createElement) return;
    let tasks = [];
    try { const data = await (await api('/api/tasks?agentId=' + encodeURIComponent(agentId))).json(); tasks = Array.isArray(data?.tasks) ? data.tasks : []; } catch { return; }
    if (agentId !== agentSelect.value) return;
    const box = $('tasks'); if (!box?.replaceChildren) return;
    box.replaceChildren(); $('tasks-card').hidden = !tasks.length;
    for (const t of tasks.slice(0, 8)) {
      const row = document.createElement('button'); row.type = 'button'; row.className = 'task'; row.setAttribute?.('aria-expanded', String(openTasks.has(t.id)));
      row.addEventListener('click', () => { openTasks.has(t.id) ? openTasks.delete(t.id) : openTasks.add(t.id); void loadTasks(); });
      const title = document.createElement('b'); title.textContent = String(t.title ?? '');
      const pill = document.createElement('span'); pill.className = 'pill ' + t.status; pill.textContent = String(t.status ?? '');
      const note = document.createElement('small');
      const detail = t.status === 'done' ? t.result : t.status === 'failed' ? t.error : '';
      note.textContent = (detail ? String(detail).replace(/\s+/g, ' ').slice(0, 160) + ' · ' : '') + (Number.isFinite(t.createdAt) ? ago(Date.now() - t.createdAt) : '');
      const steps = Array.isArray(t.activity) ? t.activity.filter(x => typeof x === 'string') : [];
      if (steps.length && !detail) note.textContent = steps.at(-1).slice(0, 140) + ' · ' + note.textContent;
      row.append(title, pill, note);
      if (openTasks.has(t.id)) {
        const more = document.createElement('div'); more.className = 'task-detail';
        const block = (label, text, cls) => { if (!text) return; const d = document.createElement('div'); if (cls) d.className = cls; const l = document.createElement('span'); l.textContent = label; d.append(l, document.createTextNode(String(text))); more.append(d); };
        block('Instructions', t.instructions);
        block('Latest steps', steps.join('\n'));
        block(t.status === 'failed' ? 'Error' : 'Result', t.status === 'failed' ? t.error : t.result, 'result');
        block('Timing', `started ${new Date(t.createdAt).toLocaleTimeString()} · updated ${new Date(t.updatedAt).toLocaleTimeString()}${t.attempts > 1 ? ` · attempt ${t.attempts}` : ''}`);
        row.append(more);
      }
      box.append(row);
    }
  }
  const micTracks = () => stream ? (stream.getAudioTracks?.() ?? stream.getTracks()) : [];
  // Mute keeps the call open but sends silence: the track is disabled, not stopped.
  function setMuted(next) {
    muted = next && active;
    for (const track of micTracks()) track.enabled = !muted;
    $('mute').setAttribute?.('aria-pressed', String(muted)); $('mute').textContent = muted ? 'Unmute' : 'Mute';
    document.querySelector?.('main')?.classList.toggle('muted', muted);
    if (active) status(muted ? 'Muted.' : 'Listening.');
  }
  const GROUP_NAMES = { core: 'Files & shell', scheduler: 'Reminders', tasks: 'Background tasks', memory: 'Memory', 'agent-comms': 'Other agents', questions: 'Questions', skills: 'Skills', 'calendar-read': 'Calendar', 'telegram-send': 'Telegram', delegate: 'Coding CLIs', dictionary: 'Dictionary', commitments: 'Commitments', herdr: 'Herdr', exec: 'Run commands', 'vault-file': 'Vault files' };
  const groupName = id => GROUP_NAMES[id] || id.replace(/[-_]/g, ' ').replace(/^./, c => c.toUpperCase());
  const allTools = () => toolGroups.flatMap(g => g.tools.map(t => t.name));
  const status = text => { $('status').textContent = text; };
  const lastAgent = () => { try { return localStorage.getItem('pibot-voice-agent') || ''; } catch { return ''; } };
  const selected = () => agents.find(agent => agent.id === agentSelect.value);
  function controls() {
    agentSelect.disabled = active || stopping || !agents.length;
    micSelect.disabled = stopping;
    startButton.disabled = active || stopping || !validToken || !audioReady || !selected()?.available;
    stopButton.disabled = !active;
    startButton.hidden = active; stopButton.hidden = !active; $('mute').hidden = !active;
    document.querySelector?.('main')?.classList.toggle('live', active);
    $('live-mode').textContent = active ? MODES[mode][0] : ''; $('live-mode').className = 'live-only badge' + (mode === 'agent' ? ' agent' : '');
    $('live-agent').textContent = active ? (selected()?.name || '') : '';
    refreshButton.disabled = active || stopping || !validToken;
    const agent = selected();
    $('agent-detail').textContent = agent && !agent.available ? (agent.reason || 'This agent is unavailable for voice.') : '';
    renderTools(); showMode();
  }
  async function api(path, options = {}) {
    const response = await fetch(path, { ...options, signal: options.signal ? AbortSignal.any([options.signal, AbortSignal.timeout(20000)]) : AbortSignal.timeout(10000), credentials: 'omit', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + secret, ...(options.body ? {'Content-Type':'application/json'} : {}) } });
    if (!response.ok) throw Object.assign(new Error('request-failed'), {status: response.status});
    return response;
  }
  // ── tools ──
  function saveChoice() { try { localStorage.setItem('pibot-voice-tools:' + agentSelect.value, JSON.stringify([...chosen])); } catch {} }
  async function loadTools() {
    const agentId = agentSelect.value;
    toolGroups = [];
    if (agentId && selected()?.available) {
      try {
        const data = await (await api('/api/tools?agentId=' + encodeURIComponent(agentId))).json();
        if (agentId !== agentSelect.value) return;
        toolGroups = Array.isArray(data?.groups) ? data.groups.filter(g => g && typeof g.id === 'string' && Array.isArray(g.tools)) : [];
      } catch { toolGroups = []; }
    }
    let saved = null; try { saved = JSON.parse(localStorage.getItem('pibot-voice-tools:' + agentId) || 'null'); } catch {}
